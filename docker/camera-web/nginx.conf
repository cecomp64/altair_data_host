# Serves the camera_snapshots volume (written by scripts/read_cameras.py,
# see docker-compose.yml) as plain static files for Grafana's "Cameras" row
# to <img src="..."> directly from the viewer's browser - Grafana itself
# never proxies the bytes, so this has to be reachable from wherever the
# dashboard is opened, same as GRAFANA_ROOT_URL.
#
# no-store on every response is the point, not an oversight: the filenames
# never change (read_cameras.py overwrites pole_south_ptz.jpg etc. in place
# every poll), so without this a browser would happily keep showing a
# cached frame from minutes ago instead of re-fetching on each dashboard
# auto-refresh.
server {
    listen 80 default_server;
    root /usr/share/nginx/html;

    location / {
        add_header Cache-Control "no-store" always;
    }
}
