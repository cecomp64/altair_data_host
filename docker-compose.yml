services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET_POWER}
      - DOCKER_INFLUXDB_INIT_RETENTION=730d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Without this, Grafana defaults to "localhost" for any link it
      # generates (alert notification "Source"/"Silence" links, share
      # links, etc.) - fine from the Pi itself, useless from a phone
      # opening those links from a Discord notification. GRAFANA_ROOT_URL
      # in .env is host-specific (Tailscale hostname, LAN IP, whatever's
      # actually reachable from where you'll be reading notifications).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
    env_file:
      - .env
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  telegraf:
    build:
      context: ./docker/telegraf
    container_name: telegraf
    privileged: true
    # Host networking gives the container multicast access to the LAN, which
    # libnss-mdns (see Dockerfile) needs to resolve the roof controller's
    # .local hostname. Docker's embedded DNS (bridge networking) can't proxy
    # mDNS, so this was previously failing dial/DNS lookups for ALPACA_BASE_URL.
    # Side effect: telegraf can no longer reach other containers by service
    # name, hence outputs.influxdb_v2 in telegraf.conf uses localhost:8086.
    network_mode: host
    env_file:
      - .env
    # SYSTEM row (telegraf.conf): inputs.cpu/mem/disk/temp/system read via
    # gopsutil, which reports the *container's* view of /proc, /sys, and
    # mounted filesystems by default - meaningless for host health under
    # Docker (a container has its own overlay disk, and without cgroup
    # limits set here its cpu/mem numbers happen to approximate the host,
    # but that's incidental, not guaranteed). The standard telegraf fix is
    # this read-only host-root bind mount plus HOST_PROC/HOST_SYS/
    # HOST_MOUNT_PREFIX, which gopsutil honors to report the real host
    # instead - confirmed against `df`/`vcgencmd`-equivalent host values
    # during setup. Read-only, and this container is already
    # privileged:true with /dev mounted, so this doesn't meaningfully
    # change its trust boundary.
    environment:
      - HOST_PROC=/hostfs/proc
      - HOST_SYS=/hostfs/sys
      - HOST_ETC=/hostfs/etc
      - HOST_MOUNT_PREFIX=/hostfs
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./scripts/read_vedirect.py:/scripts/read_vedirect.py:ro
      - ./scripts/read_ecowitt.py:/scripts/read_ecowitt.py:ro
      - ./scripts/read_ping.py:/scripts/read_ping.py:ro
      - ./scripts/read_starlink.py:/scripts/read_starlink.py:ro
      - ./scripts/read_pi_power.py:/scripts/read_pi_power.py:ro
      - /dev:/dev
      - /:/hostfs:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:
