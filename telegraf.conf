[agent]
  interval = "5s"
  round_interval = true
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  quiet = false
  # Pinned rather than left to auto-detect (which defaults to os.Hostname() -
  # inside a container with no `hostname:` set in docker-compose.yml, that's
  # Docker's random per-container id, so every container recreate silently
  # split every measurement into a new "host" tag value. Grafana groups by
  # tag, so each recreate fragmented every field into another overlapping
  # line in its panels - a fixed value here means recreates no longer churn
  # tags at all.
  hostname = "telegraf"
  omit_hostname = false

###############################################################################
# OUTPUT PLUGINS
# One outputs.influxdb_v2 block per bucket. Each is restricted to the
# measurements that belong in that domain via namepass, so a single telegraf
# agent can fan metrics out to all four buckets. See README "InfluxDB
# Architecture" for why the buckets are split.
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_POWER}"
  namepass = ["victron_smartshunt", "eco_worthy_mppt"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_WEATHER}"
  namepass = ["weather_station"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_OBSERVATORY}"
  namepass = ["observatory_roof"]

# No outputs.influxdb_v2 for the imaging bucket - N.I.N.A.'s InfluxDB Exporter
# plugin writes to it directly; telegraf never sees imaging metrics.

###############################################################################
# POWER: Victron SmartShunt (VE.Direct Text Protocol)
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_vedirect.py", "/dev/ttyUSB_VICTRON"]]
  timeout = "4s"
  data_format = "influx"

###############################################################################
# POWER: Eco-Worthy MPPT (Modbus RTU over RS485)
###############################################################################
[[inputs.modbus]]
  name = "eco_worthy_mppt"
  slave_id = 1
  timeout = "2s"
  controller = "file:///dev/ttyUSB_ECOWORTHY"
  baud_rate = 9600
  data_bits = 8
  parity = "N"
  stop_bits = 1
  transmission_mode = "RTU"

  # Eco-Worthy MPPT Modbus Address Map
  holding_registers = [
    { name = "pv_voltage",    byte_order = "AB", data_type = "UINT16", scale=0.1,  address = [256] }, # 0x0100 Volts
    { name = "pv_current",    byte_order = "AB", data_type = "UINT16", scale=0.01, address = [257] }, # 0x0101 Amps
    { name = "pv_power",      byte_order = "AB", data_type = "UINT16", scale=1.0,  address = [258] }, # 0x0102 Watts
    { name = "controller_temp", byte_order = "AB", data_type = "INT16",  scale=1.0,  address = [259] }, # 0x0103 °C
    { name = "battery_voltage", byte_order = "AB", data_type = "UINT16", scale=0.1,  address = [260] }, # 0x0104 Volts
    { name = "charging_current", byte_order = "AB", data_type = "UINT16", scale=0.01, address = [261] }, # 0x0105 Amps
  ]

###############################################################################
# WEATHER: LAN weather station local API. This gateway's `get_livedata_info`
# endpoint (confirmed via `curl --compressed "${WEATHER_API_URL}"`) returns
# nested id/val arrays with units baked into the value string (e.g.
# "0.00 mph", "31%"), not the flat {"tempf": ...} shape telegraf's json_v2
# float parser needs - so, like the Victron shunt, this goes through a
# script (scripts/read_ecowitt.py) rather than inputs.http/json_v2 directly.
# rain_hourly_in has no equivalent - this station's rain gauge doesn't emit
# an hourly-total id (0x0F), only event/day/week/month/year.
#
# Also emits indoor temp/humidity (console's wh25 sensor), the outdoor
# sensor array's battery (get_sensors_info), and moon phase - the gateway
# has no astro endpoint, so moon phase is computed locally from the date,
# not read from hardware. See read_ecowitt.py for details on all of these.
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_ecowitt.py"]]
  timeout = "5s"
  data_format = "influx"

###############################################################################
# OBSERVATORY: Roll-off-roof state via ASCOM Alpaca REST API.
# Alpaca's dome ShutterStatus is a standardized enum:
#   0 = Open, 1 = Closed, 2 = Opening, 3 = Closing, 4 = Error
# (mapped to readable labels/colors via Grafana value mappings, not here).
# Three endpoints, each returning {"Value": ..., ...} - one input block per
# endpoint since json_v2 can't rename "Value" differently per URL otherwise.
# (AtHome is intentionally omitted: this driver returns ErrorNumber 1024
# "Not implemented" for it - AtHome is optional in the ASCOM Dome spec.)
###############################################################################
[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/shutterstatus"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "shutter_status"
      type = "int"

[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/slewing"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "slewing"
      type = "bool"

[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/connected"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "connected"
      type = "bool"

# DragonLAIR's own native status endpoint (not part of the Alpaca spec -
# vendor-specific to Dark Dragons Astronomy's DragonLAIR controller). Polled
# in addition to the Alpaca endpoints above because ShutterStatus's enum has
# no state for "stopped partway open", so the Alpaca driver reports that as
# Error (4) even though it isn't one; roof_state gives the real string
# ("open", "closed", "opening", "closing", "partially_open") instead.
# voltage/current units are unconfirmed - named "_raw" until verified against
# a multimeter; the magnitude (~14481 for what's presumably a 12V supply)
# suggests millivolts/milliamps.
[[inputs.http]]
  urls = ["${DRAGONLAIR_STATUS_URL}"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "state"
      rename = "roof_state"
      type = "string"
    [[inputs.http.json_v2.field]]
      path = "safety.isSafetyMonitorSafe"
      rename = "safety_monitor_safe"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "isWeatherLocked"
      rename = "weather_locked"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "voltage"
      rename = "roof_controller_voltage_raw"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "current"
      rename = "roof_controller_current_raw"
      type = "int"

# IMAGING: no telegraf input here. N.I.N.A.'s "InfluxDB Exporter" plugin
# (https://github.com/daleghent/nina-influxdb-exporter) writes directly to
# the imaging bucket over the InfluxDB v2 API from the imaging PC itself -
# see README "Imaging" section for the plugin's own config fields (URL/org/
# bucket/token) and the metrics it produces.
