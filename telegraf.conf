[agent]
  interval = "5s"
  round_interval = true
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  quiet = false
  # Pinned rather than left to auto-detect (which defaults to os.Hostname() -
  # inside a container with no `hostname:` set in docker-compose.yml, that's
  # Docker's random per-container id, so every container recreate silently
  # split every measurement into a new "host" tag value. Grafana groups by
  # tag, so each recreate fragmented every field into another overlapping
  # line in its panels - a fixed value here means recreates no longer churn
  # tags at all.
  hostname = "telegraf"
  omit_hostname = false

###############################################################################
# OUTPUT PLUGINS
# One outputs.influxdb_v2 block per bucket. Each is restricted to the
# measurements that belong in that domain via namepass, so a single telegraf
# agent can fan metrics out to all four buckets. See README "InfluxDB
# Architecture" for why the buckets are split.
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_POWER}"
  namepass = ["victron_smartshunt", "eco_worthy_mppt"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_WEATHER}"
  namepass = ["weather_station", "astro"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_OBSERVATORY}"
  namepass = ["observatory_roof", "camera_snapshot", "camera_health", "camera_ai"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_NETWORK}"
  namepass = ["ping"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_STARLINK}"
  namepass = ["starlink"]

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "${INFLUXDB_ADMIN_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET_SYSTEM}"
  namepass = ["cpu", "mem", "disk", "temp", "system", "pi_power"]

# No outputs.influxdb_v2 for the imaging bucket - N.I.N.A.'s InfluxDB Exporter
# plugin writes to it directly; telegraf never sees imaging metrics.

###############################################################################
# POWER: Victron SmartShunt (VE.Direct Text Protocol)
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_vedirect.py", "/dev/ttyUSB_VICTRON"]]
  timeout = "4s"
  data_format = "influx"

###############################################################################
# POWER: Eco-Worthy MPPT (Modbus RTU over RS485)
###############################################################################
# Goes through a script rather than inputs.modbus directly - that plugin
# hangs indefinitely against this controller/adapter, confirmed by testing
# a plain pyserial request/response against the same port/baud/register map,
# which gets a clean, CRC-valid reply every time. See read_ecoworthy_mppt.py.
[[inputs.exec]]
  commands = [["python3", "/scripts/read_ecoworthy_mppt.py", "/dev/ttyUSB_ECOWORTHY"]]
  timeout = "5s"
  data_format = "influx"

###############################################################################
# WEATHER: LAN weather station local API. This gateway's `get_livedata_info`
# endpoint (confirmed via `curl --compressed "${WEATHER_API_URL}"`) returns
# nested id/val arrays with units baked into the value string (e.g.
# "0.00 mph", "31%"), not the flat {"tempf": ...} shape telegraf's json_v2
# float parser needs - so, like the Victron shunt, this goes through a
# script (scripts/read_ecowitt.py) rather than inputs.http/json_v2 directly.
# Rain: event/rate/day/week/month/year (ids 0x0D/0x0E/0x10-0x13, confirmed
# against Ecowitt's own "HTTP API interface Protocol" PDF). No "rain hour"
# id exists in that spec at all - 0x0F is "Rain gain" (a calibration value,
# not an accumulation period) and isn't in this station's response anyway.
#
# Also emits indoor temp/humidity (console's wh25 sensor), the outdoor
# sensor array's battery (get_sensors_info), and moon phase - the gateway
# has no astro endpoint, so moon phase is computed locally from the date,
# not read from hardware. See read_ecowitt.py for details on all of these.
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_ecowitt.py"]]
  timeout = "5s"
  data_format = "influx"

# Sun/moon altitude, computed locally via pyephem from LATITUDE/LONGITUDE/
# ELEVATION_M in .env - independent of both N.I.N.A. (which only reports
# this to the imaging bucket while a session is actually running) and this
# weather station's own uptime (unlike moon phase above, which is real but
# still only emitted as part of that station's own API poll). Pure math, no
# I/O beyond the clock, so cheap regardless of interval - 60s here is just
# "frequent enough to look smooth on a chart."
[[inputs.exec]]
  commands = [["python3", "/scripts/read_astro.py"]]
  interval = "60s"
  timeout = "5s"
  data_format = "influx"

###############################################################################
# OBSERVATORY: Roll-off-roof state via ASCOM Alpaca REST API.
# Alpaca's dome ShutterStatus is a standardized enum:
#   0 = Open, 1 = Closed, 2 = Opening, 3 = Closing, 4 = Error
# (mapped to readable labels/colors via Grafana value mappings, not here).
# Three endpoints, each returning {"Value": ..., ...} - one input block per
# endpoint since json_v2 can't rename "Value" differently per URL otherwise.
# (AtHome is intentionally omitted: this driver returns ErrorNumber 1024
# "Not implemented" for it - AtHome is optional in the ASCOM Dome spec.)
###############################################################################
[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/shutterstatus"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "shutter_status"
      type = "int"

[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/slewing"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "slewing"
      type = "bool"

[[inputs.http]]
  urls = ["${ALPACA_BASE_URL}/connected"]
  method = "GET"
  timeout = "5s"
  interval = "15s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [inputs.http.tags]
    device_number = "${ALPACA_DOME_DEVICE_NUMBER}"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "Value"
      rename = "connected"
      type = "bool"

# DragonLAIR's own native status endpoints (not part of the Alpaca spec -
# vendor-specific to Dark Dragons Astronomy's DragonLAIR controller). Polled
# in addition to the Alpaca endpoints above because ShutterStatus's enum has
# no state for "stopped partway open", so the Alpaca driver reports that as
# Error (4) even though it isn't one; roof_state gives the real string
# ("open", "closed", "opening", "closing", "partially_open") instead.
# voltage/current units are unconfirmed - named "_raw" until verified against
# a multimeter; the magnitude (~14481 for what's presumably a 12V supply)
# suggests millivolts/milliamps.
#
# Uses /indi/status rather than the plain /status Draco endpoint - same
# "state" string, but also carries lastStateChangeReason, which is how the
# controller reports things like a motor stall/overcurrent trip (manual:
# "Motor Stall Detection" stops the motor and reports an error above the
# configured Motor Stall Current, default 30A). There's no separate
# event-log endpoint, so lastStateChangeReason only ever holds the *last*
# reason - but since this poll runs every 30s and each poll is its own
# InfluxDB point, the field's value-over-time in Grafana effectively is
# the event history. Discovered via the device's own /openapi.yaml
# (undocumented in the published PDF manual).
[[inputs.http]]
  urls = ["${DRAGONLAIR_STATUS_URL}"]
  method = "GET"
  timeout = "5s"
  interval = "30s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "state"
      rename = "roof_state"
      type = "string"
    [[inputs.http.json_v2.field]]
      path = "safety.isSafetyMonitorSafe"
      rename = "safety_monitor_safe"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "isWeatherLocked"
      rename = "weather_locked"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "voltage"
      rename = "roof_controller_voltage_raw"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "current"
      rename = "roof_controller_current_raw"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "lastStateChangeReason"
      rename = "roof_last_state_change_reason"
      type = "string"
    [[inputs.http.json_v2.field]]
      path = "secondsToOpen"
      rename = "roof_seconds_to_open"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "secondsToClose"
      rename = "roof_seconds_to_close"
      type = "int"
    [[inputs.http.json_v2.field]]
      path = "cpuTemperature"
      rename = "roof_controller_cpu_temperature_c"
      type = "float"
    [[inputs.http.json_v2.field]]
      path = "uptime"
      rename = "roof_controller_uptime_raw"
      type = "int"

# /indi/full_status: same device, only polled for the handful of fields that
# aren't on /indi/status above - they live nested under this endpoint's
# "data" object instead. Kept as a second input (rather than switching the
# block above to this endpoint entirely) because full_status's top-level
# "status" field is a differently-cased/formatted string ("Closed", not
# "closed") than the "state" field already relied on by the roof_state value
# mappings in the Grafana dashboard - not worth the risk of silently breaking
# those to save one HTTP request per interval.
[[inputs.http]]
  urls = ["${DRAGONLAIR_FULL_STATUS_URL}"]
  method = "GET"
  timeout = "5s"
  interval = "30s"
  name_override = "observatory_roof"
  data_format = "json_v2"
  [[inputs.http.json_v2]]
    [[inputs.http.json_v2.field]]
      path = "data.safetyMonitorReason"
      rename = "roof_safety_monitor_reason"
      type = "string"
    [[inputs.http.json_v2.field]]
      path = "data.isWeatherSensorTripped"
      rename = "roof_weather_sensor_tripped"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "data.isSunAltitudeSafe"
      rename = "roof_sun_altitude_safe"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "data.isVoltageMonitorSafe"
      rename = "roof_voltage_monitor_safe"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "data.isManuallyOpened"
      rename = "roof_manually_opened"
      type = "bool"
    [[inputs.http.json_v2.field]]
      path = "data.isRoofMoving"
      rename = "roof_moving"
      type = "bool"

# Camera snapshots: three Reolink cameras (CAMERA_POLE_SOUTH, _OBS_WEST,
# _OBS_EAST in .env) polled over their local HTTPS API - see
# scripts/read_cameras.py. CAMERA_POLE_SOUTH is a dual-lens camera, so it
# contributes two frames (channel-configurable via
# CAMERA_POLE_SOUTH_PTZ_CHANNEL/_PANO_CHANNEL). Each frame is written to the
# camera_snapshots docker volume, served to Grafana's "Cameras" row by the
# camera-web nginx container (docker-compose.yml) - the line protocol
# emitted here is only success/size/latency per camera, for the "Last
# Snapshot Age" stat tiles and Discord alerting on a camera going stale, not
# the image itself (InfluxDB is a time-series store, not a blob store).
#
# 300s, not 60s: measured directly against the real cameras (curl timing,
# one poll cycle) - CAMERA_POLE_SOUTH's two channels are ~834KB + ~1139KB,
# CAMERA_OBS_WEST/_EAST ~572KB + ~523KB, ~3.07MB total per poll. At 60s
# that's ~4.4GB/day; at 300s, ~885MB/day - still plenty fresh for a
# dashboard still-frame (nothing here needs 1-minute currency) at a fifth
# of the volume. This matters more than the raw byte count suggests:
# CAMERA_POLE_SOUTH is confirmed (GetLocalLink API) on Wifi, not wired
# Ethernet like the other two - so every poll is also a WiFi radio TX burst,
# not just LAN traffic (its GetAbility response reports no battery support,
# so it's mains-powered - the WiFi link itself, not camera power, is what
# this protects). CAMERA_OBS_WEST/_EAST are wired. Keep in sync with the
# "Last Snapshot Age" stat panel thresholds in the dashboard JSON (currently
# tuned as multiples of this interval) if you change it.
[[inputs.exec]]
  commands = [["python3", "/scripts/read_cameras.py"]]
  interval = "300s"
  timeout = "30s"
  data_format = "influx"

# Cheap liveness check, separate from the image poll above and run far more
# often - see scripts/read_camera_health.py. One GetDevInfo call per
# physical device (not per lens - CAMERA_POLE_SOUTH's two snapshot streams
# share one liveness check), ~835 bytes and ~0.2s each, vs. 500KB-1.1MB and
# 0.6-1.2s for a Snap (measured directly). Also pulls CAMERA_POLE_SOUTH's
# WiFi signal (0-4 bars) as a trend metric, since GetLocalLink confirms
# it's the one camera on WiFi - CAMERA_OBS_WEST/_EAST are wired, and were
# observed returning a meaningless constant here, so it's skipped for them.
# The "Camera Offline" Discord alert (§13) is keyed off this measurement,
# not camera_snapshot, so a dead camera is caught within minutes instead of
# waiting up to a 300s snapshot cycle.
[[inputs.exec]]
  commands = [["python3", "/scripts/read_camera_health.py"]]
  interval = "60s"
  timeout = "10s"
  data_format = "influx"

# On-device AI detection (person/vehicle/dog_cat - all three cameras support
# these per GetAbility, none support face) via scripts/read_camera_ai.py.
# GetAiState just reads the camera's own already-computed classifier state,
# no extra work triggered by asking - measured at ~470-570 bytes and
# ~0.15-0.25s per call, essentially the same cost as the liveness check
# above, so 30s here (tighter than the 60s health check) costs nothing
# extra even on CAMERA_POLE_SOUTH's WiFi link. Per-lens, not per-device
# (unlike camera_health): CAMERA_POLE_SOUTH's two lenses point at different
# fields of view, so pole_south_ptz/pole_south_pano get independent
# detections.
#
# Dashboard visibility only (AI Detection History timeline, §9) - no
# Discord alert on this. Considered one (fire on person/vehicle detected,
# using max() over a rolling window so a brief blip isn't missed between
# 30s polls and a 1m eval cycle), but a raw detection at a rural site fires
# for wildlife and for you, at the scope, about as often as for anything
# worth being paged for - noisy enough to end up ignored. Revisit if a
# usefully-specific condition shows up (e.g. gated to hours the roof is
# closed, or people specifically rather than any detection).
#
# pole_south_ptz/pole_south_pano additionally archive a still (via Snap,
# edge-triggered on dog_cat so a multi-minute sighting only saves one frame)
# into camera_snapshots/detections/, with the relative path emitted as a
# snapshot_path string field alongside that poll's line - see
# scripts/read_camera_ai.py and the "Animal Detection Snapshots" panel (§9).
[[inputs.exec]]
  commands = [["python3", "/scripts/read_camera_ai.py"]]
  interval = "30s"
  timeout = "10s"
  data_format = "influx"

###############################################################################
# NETWORK: periodic ping health check (internet reachability + Tailscale
# mesh). Host lists come from PING_TARGETS_INTERNET / PING_TARGETS_TAILSCALE
# in .env, comma-separated (e.g. "1.1.1.1,8.8.8.8,google.com") - a variable-
# length list driven by an env var isn't expressible as a native TOML array
# under telegraf's strict env var handling (confirmed via `telegraf --test`;
# see scripts/read_ping.py's docstring for why), so this goes through a
# script rather than inputs.ping directly, same rationale as the VE.Direct
# and Ecowitt scripts above. Output field names/semantics (including
# result_code) intentionally match inputs.ping's own.
#
# 3 pings/host on a 60s interval keeps this to a handful of ICMP packets a
# minute regardless of how many hosts are configured - negligible bandwidth.
# "tailscale" is its own network tag (rather than lumped into "internet") so
# a down Tailscale peer doesn't read as "the internet is down" in Grafana.
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_ping.py"]]
  interval = "60s"
  timeout = "20s"
  data_format = "influx"

###############################################################################
# SYSTEM: this Pi's own health (CPU, memory, disk, temperature, load).
# Everything else in this file monitors something external to the host;
# this is the one section that watches the host itself, which matters since
# it runs headless and off-grid. Uses telegraf's built-in system plugins
# (gopsutil) rather than a custom script, unlike the sections above - no
# oddly-shaped API to work around here, this is exactly what they're for.
# Needs the HOST_PROC/HOST_SYS/HOST_MOUNT_PREFIX env vars + read-only
# /:/hostfs:ro bind mount from docker-compose.yml to report the real host's
# stats rather than this container's own isolated view - see the comment
# there. 30s interval: cheap enough to run at the global 5s default, but
# system health doesn't need sub-minute resolution and there's no reason to
# spend the extra storage on it.
###############################################################################
[[inputs.cpu]]
  interval = "30s"
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]
  interval = "30s"

[[inputs.disk]]
  interval = "30s"
  mount_points = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "overlay", "aufs", "squashfs"]

# cpu_thermal = the Pi's SoC; rp1_adc = the Pi 5's RP1 southbridge chip
# (handles USB/Ethernet/PCIe) - both throttle-relevant, so both are kept.
[[inputs.temp]]
  interval = "30s"

[[inputs.system]]
  interval = "30s"

# Pi power health via scripts/read_pi_power.py (vcgencmd) - under-voltage/
# throttle status on any Pi model, plus PMIC per-rail voltage/current on a
# Pi 5. Emits nothing (exits 0, no output) if vcgencmd isn't present, e.g.
# on the non-Pi "Mini PC" hosts this repo also targets.
[[inputs.exec]]
  commands = [["python3", "/scripts/read_pi_power.py"]]
  interval = "30s"
  timeout = "10s"
  data_format = "influx"

###############################################################################
# STARLINK: dish power draw + alerts/events via its local gRPC API
# (192.168.100.1:9200 by default, override with STARLINK_DISH_ADDR in .env -
# only needed if your router doesn't put the dish at its usual address).
# Purely a LAN call to the dish itself, not the WAN link being monitored, so
# unlike the NETWORK section above there's no bandwidth concern driving the
# polling interval - 60s here is just "frequent enough to be useful, not so
# frequent it's noisy." scripts/read_starlink.py's power reading is a mean
# over the last N one-second samples the dish keeps internally, where N
# defaults to matching this interval (STARLINK_POLL_INTERVAL_S) so each
# window abuts the last with no gap/overlap - keep the two in sync if you
# change this.
###############################################################################
[[inputs.exec]]
  commands = [["python3", "/scripts/read_starlink.py"]]
  interval = "60s"
  timeout = "15s"
  data_format = "influx"

# IMAGING: no telegraf input here. N.I.N.A.'s "InfluxDB Exporter" plugin
# (https://github.com/daleghent/nina-influxdb-exporter) writes directly to
# the imaging bucket over the InfluxDB v2 API from the imaging PC itself -
# see README "Imaging" section for the plugin's own config fields (URL/org/
# bucket/token) and the metrics it produces.
